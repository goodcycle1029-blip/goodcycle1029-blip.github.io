<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff}
  iframe{border:0;display:block;margin:0;padding:0;background:#fcf9f4}
  #box{width:390px}
</style>
</head>
<body>
<div id="box" role="region" aria-label="모바일 미리보기"><iframe id="f" src="./index.html" width="390" height="900" scrolling="no" title="미리보기"></iframe></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '390', 10);
  var f = document.getElementById('f');
  f.setAttribute('src', './index.html?t=' + Date.now());
  document.getElementById('box').style.width = w + 'px';
  f.setAttribute('width', w);
  f.style.width = w + 'px';
  f.addEventListener('load', function(){
    try {
      var h = f.contentDocument.documentElement.scrollHeight;
      f.style.height = h + 'px';
      f.setAttribute('height', h);
      document.title = '미리보기 ' + w + 'x' + h;
    } catch (e) {}
  });
})();
</script>
</body>
</html>
