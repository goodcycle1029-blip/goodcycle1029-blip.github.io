<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="description" content="한 번만 톡 누르면 되는 원터치 타워 쌓기 게임. 오늘의 랭킹에서 내 순위를 확인해 보세요." />
<title>원터치 타워 · 오늘의 랭킹</title>
<style>
  :root{
    --ink:#eaf0ff;
    --dim:#9fb0d0;
    --line:rgba(255,255,255,.14);
    --accent:#7ee0ff;
    --accent2:#a98bff;
    --warn:#ff9a7b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;background:#070a16;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
  }
  #app{position:fixed;inset:0}
  #stage{position:relative;width:100%;height:100%;overflow:hidden}
  #game{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;top:0;left:0;right:0;z-index:6;
    display:flex;align-items:flex-start;gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 0;
    pointer-events:none;
  }
  .hud-score{
    font-size:46px;font-weight:800;line-height:.92;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;text-shadow:0 6px 26px rgba(0,0,0,.5);
  }
  .hud-score small{font-size:15px;font-weight:700;color:var(--dim);margin-left:5px;letter-spacing:0}
  .hud-mid{flex:1;padding-top:4px;min-width:0}
  .combo-tag{
    display:inline-block;font-size:12px;font-weight:800;color:#08101f;
    background:linear-gradient(90deg,#7ee0ff,#a98bff);
    padding:3px 9px;border-radius:99px;opacity:.28;
    transition:opacity .18s ease,transform .18s ease;
  }
  .combo-tag.on{opacity:1;transform:scale(1.06)}
  .hud-best{font-size:12px;color:var(--dim);margin-top:5px;letter-spacing:.01em}
  .hud-best b{color:var(--ink)}
  .icon-btn{
    pointer-events:auto;width:44px;height:44px;flex:0 0 44px;border-radius:14px;
    border:1px solid var(--line);background:rgba(10,16,32,.55);color:var(--ink);
    font-size:18px;line-height:1;display:grid;place-items:center;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .icon-btn:active{transform:scale(.95)}

  /* ---------- 아이템 HUD 배지 ---------- */
  .item-hud{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .item-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:800;letter-spacing:-.01em;
    padding:3px 8px;border-radius:99px;
    border:1px solid rgba(255,255,255,.16);background:rgba(10,16,32,.62);color:#eaf0ff;
    box-shadow:0 4px 14px rgba(0,0,0,.28);
    font-variant-numeric:tabular-nums;
  }
  .item-badge.shield{color:#ece4ff;border-color:rgba(169,139,255,.7);background:rgba(72,46,132,.62)}
  .item-badge.slow{color:#dff1ff;border-color:rgba(96,190,255,.62);background:rgba(18,58,108,.62)}
  .item-badge.next{color:rgba(200,215,245,.72);border-color:rgba(255,255,255,.12);background:rgba(10,16,32,.42);font-weight:700}

  .tap-hint{
    position:absolute;left:0;right:0;z-index:5;pointer-events:none;
    bottom:calc(70px + env(safe-area-inset-bottom));
    text-align:center;font-size:13px;color:rgba(232,240,255,.75);
    opacity:0;transition:opacity .35s ease;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .tap-hint.on{opacity:1}

  /* ---------- 하단 고정 배너 (AD_CONFIG) ---------- */
  #adBanner{
    position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:320px;max-width:calc(100% - 20px);height:50px;
    z-index:25;
    pointer-events:none;opacity:.55;
    transition:opacity .25s ease,filter .25s ease;
    filter:saturate(.8);
    border-radius:11px;
  }
  /* 시작·결과 화면에서만 클릭 가능 */
  #adBanner.live{pointer-events:auto;opacity:1;filter:none}

  .ad-shell{position:relative;width:100%;height:100%;border-radius:11px;overflow:hidden}
  .ad-link{
    display:flex;align-items:center;gap:9px;width:100%;height:100%;
    padding:0 10px;text-decoration:none;color:#221410;
    background:linear-gradient(100deg,#fffdf9,#fff1ec 58%,#ffe3da);
    border:1px solid rgba(230,80,70,.28);border-radius:11px;
    box-shadow:0 8px 22px rgba(0,0,0,.32);
    font-family:inherit;
  }
  .ad-emoji{font-size:19px;line-height:1;flex:0 0 auto}
  /* 일본 국기 배지 (이모지 글꼴에 따라 깨지지 않게 CSS로 그림) */
  .ad-flag{
    flex:0 0 auto;width:26px;height:17px;border-radius:2.5px;position:relative;
    background:#ffffff;border:1px solid rgba(0,0,0,.10);
    box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .ad-flag::after{
    content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;
    margin:-4px 0 0 -4px;border-radius:50%;background:#d21f2a;
  }
  .ad-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
  .ad-brand{
    font-size:12.5px;font-weight:900;letter-spacing:-.02em;color:#d21f2a;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ad-desc{
    font-size:10px;font-weight:600;color:#7d6a63;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ad-cta{
    flex:0 0 auto;font-size:10px;font-weight:900;color:#fff;
    background:#d21f2a;border-radius:99px;padding:5px 8px;white-space:nowrap;
  }
  .ad-mini{
    position:absolute;top:4px;right:9px;font-size:7px;font-weight:800;
    letter-spacing:.08em;color:rgba(140,104,94,.5);
  }

  /* ---------- 결과창 배너 (AD_CONFIG) ---------- */
  .ad-result{width:100%;max-width:300px;margin:0 auto}
  .ad-result .ad-link{
    flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;
    height:auto;min-height:132px;padding:14px 15px;border-radius:16px;position:relative;
    background:linear-gradient(135deg,#fffdf9,#fff0ea 60%,#ffe0d5);
  }
  .ad-result .ad-emoji{font-size:26px}
  .ad-result .ad-flag{width:32px;height:21px;border-radius:3px}
  .ad-result .ad-brand{font-size:14.5px;font-weight:900;white-space:normal;line-height:1.28}
  .ad-result .ad-desc{font-size:11.5px;font-weight:700;color:#8a6f66;white-space:normal;line-height:1.3}
  .ad-cta-big{
    margin-top:4px;font-size:12px;font-weight:900;color:#fff;
    background:linear-gradient(180deg,#e6323a,#c8121c);
    border-radius:99px;padding:7px 14px;
    box-shadow:0 6px 16px rgba(200,30,40,.28);
  }

  /* 광고 코드가 비어 있을 때만 보이는 자리 표시 */
  .ad-empty{
    width:100%;height:100%;min-height:50px;
    border:1.5px dashed rgba(140,172,222,.32);border-radius:11px;
    background:rgba(10,18,36,.32);color:rgba(190,205,235,.45);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;letter-spacing:.14em;
  }

  /* ---------- 오버레이 ---------- */
  .overlay{
    position:absolute;inset:0;z-index:20;display:none;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(18px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 80% at 50% 0%,rgba(36,28,74,.965),rgba(6,9,20,.99) 66%);
  }
  .overlay.show{display:block}
  .overlay.show.start-mode{display:flex;flex-direction:column;justify-content:center}
  .card{width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

  /* 시작 화면 */
  .brand{
    align-self:center;font-size:10px;font-weight:800;letter-spacing:.16em;
    color:rgba(200,215,245,.6);border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  }
  .game-title{
    margin:8px 0 0;text-align:center;font-size:40px;line-height:1.1;letter-spacing:-.04em;font-weight:900;
    background:linear-gradient(180deg,#ffffff,#8fd8ff 70%,#a98bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{margin:0;text-align:center;font-size:13.5px;color:var(--dim)}
  .how{
    display:flex;flex-direction:column;gap:8px;margin-top:8px;
    background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:14px;
  }
  .how-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#dfe8ff}
  .how-row span{
    flex:0 0 20px;width:20px;height:20px;border-radius:99px;display:grid;place-items:center;
    font-size:11px;font-weight:800;color:#08101f;background:linear-gradient(180deg,#9ff0ff,#5fd0f5);
  }
  .how-row b{color:#fff}
  .how-row.item-row span{background:linear-gradient(180deg,#ffe9a0,#ffc93c)}
  .start-stats{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    font-size:12.5px;color:var(--dim);
  }
  .start-stats b{color:var(--ink);font-size:14px}
  .start-today{text-align:center;font-size:11px;color:rgba(180,196,226,.6);letter-spacing:.02em}
  .mini{font-size:11px;color:rgba(180,196,226,.62);text-align:center;line-height:1.5;margin:2px 0 0}

  /* 아이템 안내 칩 */
  .item-legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
  .item-legend span{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;color:#e2eaff;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:99px;padding:5px 10px;
  }
  .item-legend i{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
  .item-legend .w i{background:linear-gradient(180deg,#ffe9a0,#ffc93c);box-shadow:0 0 8px rgba(255,201,60,.7)}
  .item-legend .s i{background:linear-gradient(180deg,#c6e9ff,#4fb6ff);box-shadow:0 0 8px rgba(79,182,255,.7)}
  .item-legend .h i{background:linear-gradient(180deg,#e7dcff,#a98bff);box-shadow:0 0 8px rgba(169,139,255,.7)}

  /* 버튼 */
  .btn{
    border:0;border-radius:16px;height:54px;padding:0 18px;
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:-.01em;
    color:#08101f;background:linear-gradient(180deg,#9ff0ff,#5fd0f5);
    box-shadow:0 10px 24px rgba(80,200,255,.18);
    display:flex;align-items:center;justify-content:center;
  }
  .btn:active{transform:translateY(1px)}
  .btn.big{height:58px;font-size:17px;border-radius:18px}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.small{height:44px;font-size:13px;padding:0 14px;border-radius:12px;box-shadow:none}
  .btn[disabled]{opacity:.45}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{flex:1}

  /* 게임오버 화면 */
  .go-kicker{text-align:center;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.04em}
  .go-reason{text-align:center;font-size:11.5px;color:rgba(180,196,226,.6);margin-top:-6px}
  .rank-wrap{
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:22px;
    padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .rank-big{display:flex;align-items:flex-end;justify-content:center;gap:5px;font-weight:900;letter-spacing:-.04em}
  .rank-num{
    font-size:78px;line-height:.86;
    background:linear-gradient(180deg,#ffffff,#8fd8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rank-unit{font-size:24px;color:var(--dim);padding-bottom:10px}
  .rank-sub{font-size:13px;color:var(--dim)}
  .pct-chip{
    margin-top:2px;font-size:13px;font-weight:800;color:#08101f;
    background:linear-gradient(90deg,#7ee0ff,#a98bff);border-radius:99px;padding:4px 12px;
  }
  .tier-msg{text-align:center;font-size:12.5px;color:#dfe8ff;margin-top:-2px}
  .score-row{display:flex;justify-content:center;gap:8px}
  .score-chip{
    flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:14px;padding:8px 6px;text-align:center;
  }
  .score-chip b{display:block;font-size:19px;font-weight:800;line-height:1.2}
  .score-chip span{font-size:11px;color:var(--dim)}
  .score-chip.good b{color:#8ff0c0}

  .nick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
  .nick-label{font-size:11.5px;color:var(--dim);flex:0 0 auto}
  .nick-input{
    flex:1 1 120px;min-width:0;height:44px;border-radius:12px;
    border:1px solid var(--line);background:rgba(8,14,28,.7);color:var(--ink);
    font-family:inherit;font-size:14px;padding:0 12px;outline:none;
  }
  .nick-input:focus{border-color:rgba(126,224,255,.6)}
  .nick-msg{flex:1 1 100%;font-size:11px;color:rgba(180,196,226,.62);line-height:1.4}

  .reward{display:flex;flex-direction:column;gap:8px}
  .reward-panel{
    display:flex;align-items:center;gap:11px;
    background:linear-gradient(135deg,rgba(90,130,255,.16),rgba(170,120,255,.16));
    border:1px solid rgba(160,150,255,.28);border-radius:16px;padding:12px 14px;
  }
  .reward-emoji{
    flex:0 0 38px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:19px;line-height:1;
    background:linear-gradient(180deg,rgba(169,139,255,.34),rgba(90,110,255,.22));
    border:1px solid rgba(180,160,255,.3);
  }
  .reward-txt{flex:1;min-width:0}
  .reward-txt b{display:block;font-size:13px;font-weight:800;color:#fff}
  .reward-txt span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
  .reward-status{font-size:11.5px;color:var(--dim);text-align:center;min-height:16px}
  .reward-done{
    font-size:11.5px;color:rgba(180,196,226,.6);text-align:center;
    border:1px dashed rgba(140,172,222,.3);border-radius:12px;padding:10px;
  }

  .lb{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .lb-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:rgba(188,203,232,.7);margin-top:6px}
  .lb-list{display:flex;flex-direction:column;gap:2px}
  .lb-row{
    display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;
    padding:6px 10px;border-radius:9px;font-size:13px;
    background:rgba(255,255,255,.025);
  }
  .lb-row.mine{background:rgba(126,224,255,.14);outline:1px solid rgba(126,224,255,.35)}
  .lb-rank{color:rgba(160,180,215,.85);font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
  .lb-row.mine .lb-rank{color:#bfefff}
  .lb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6eeff}
  .lb-score{font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .lb-me-tag{
    font-size:9px;font-weight:800;color:#08101f;background:#7ee0ff;
    border-radius:99px;padding:1px 5px;letter-spacing:.02em;
  }
  .lb-gap{font-size:10px;color:rgba(160,180,215,.5);text-align:center;padding:1px 0}

  .disclaimer{font-size:10px;color:rgba(170,186,218,.45);text-align:center;line-height:1.5;margin:6px 0 0}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-score"><span id="floorNum">0</span><small>층</small></div>
      <div class="hud-mid">
        <div id="comboTag" class="combo-tag">콤보 ×0</div>
        <div class="hud-best">최고 <b id="bestNum">0</b>층</div>
        <div id="itemHud" class="item-hud"></div>
      </div>
      <button id="muteBtn" class="icon-btn" type="button" aria-label="소리 켜기/끄기" aria-pressed="false">🔊</button>
    </div>

    <div id="tapHint" class="tap-hint">화면 아무 곳이나 한 번 터치</div>

    <div id="adBanner" role="complementary" aria-label="광고"></div>

    <div id="overlay" class="overlay"></div>
  </div>
</div>

<script>
/* =========================================================================
   AD_CONFIG  ──  광고 교체 스위치 (여기만 고치면 광고가 통째로 바뀝니다)
   -------------------------------------------------------------------------
   ① 지금은 자체 배너(mode: 'self')로 재팬마트박스 광고가 나옵니다.
      self.banners.bottom  → 게임 하단에 항상 붙어 있는 320×50 띠 배너
      (banner 의 flag:'jp' 는 일본 국기 배지, emoji:'🛒' 처럼 이모지를 쓰려면 emoji 필드)
      self.banners.result  → 결과(게임오버) 화면 300×120~250 배너
      배열에 여러 개를 넣으면 rotateMs 간격으로 돌아가며 노출됩니다.

   ② 나중에 구글 애드센스·카카오 애드핏·제휴 배너로 바꿀 때는
      mode 를 'custom_html' 로 바꾸고 custom_html 안에 발급받은 코드를
      그대로 붙여넣으면 됩니다. (스크립트 태그도 실행됩니다)

        mode: 'custom_html',
        custom_html: {
          bottom: '애드센스에서 발급받은 320x50 광고 코드를 그대로',
          result: '카카오 애드핏 300x250 광고 코드를 그대로'
        }

      ※ 광고 코드에 스크립트 태그가 들어 있어도 그대로 실행됩니다.

   ③ 광고를 잠시 끄고 싶으면 mode: 'none' 으로 두면 자리가 비워집니다.
   ========================================================================= */
const AD_CONFIG = {
  mode: 'self',            // 'self' | 'custom_html' | 'none'

  // 자체 배너 (재팬마트박스)
  self: {
    rotateMs: 12000,
    banners: {
      bottom: [
        {
          flag: 'jp',                 // 일본 국기 배지 (이모지 대신 CSS로 그려 모든 기기에서 동일)
          title: '재팬마트박스',
          desc: '· 일본 현지 직구 셀렉트샵',
          cta: '구경하기',
          url: 'https://smartstore.naver.com/japanmartbox'
        }
      ],
      result: [
        {
          emoji: '🛒',
          title: '일본 공구·생활용품·인기 과자 직구',
          desc: '· 재팬마트박스 스마트스토어',
          cta: '바로가기',
          url: 'https://smartstore.naver.com/japanmartbox'
        }
      ]
    }
  },

  // 외부 광고(애드센스·애드핏·제휴) 코드를 넣는 곳
  custom_html: {
    bottom: '',
    result: ''
  }
};
/* ========================================================================= */

(function () {
  'use strict';

  /* =========================================================
     0. 작은 도우미들
     ========================================================= */
  var $ = function (sel) { return document.querySelector(sel); };
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  /* =========================================================

  var STORE_KEY = 'oneTouchTower.v2';

  function loadStore() {

      if (Object.prototype.toString.call(o.records) === '[object Array]') {

        }).slice(0, 40).map(function (r) {

      /* 사생활 보호 모드 등 저장소가 없는 환경에서는 조용히 기록 없이 진행 */

  /* =========================================================

  var FAKE_COUNT = 1248;
  var GLOBAL = [];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function todaySeed() {
    var d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }

  var NAME_A = ['새벽', '구름', '레몬', '복숭아', '초코', '네온', '달빛', '소나기', '모래', '은하',
    '딸기', '고양이', '펭귄', '한강', '제주', '별빛', '노을', '민트', '바닐라', '카페',
    '우주', '번개', '거북', '다람쥐', '토끼', '하늘', '바다', '숲', '겨울', '여름',
    '봄비', '가을'];
  var NAME_B = ['타워', '쌓기', '장인', '초보', '고수', '러버', '마스터', '도전자', '기사',
    '연습생', '요정', '수집가', '여행자', '개발자', '학생'];

  function buildGlobal() {
    var rnd = mulberry32(todaySeed());
    var used = {};
    GLOBAL = [];
    for (var i = 0; i < FAKE_COUNT; i++) {
      // 실제 플레이처럼 낮은 층에 몰리고 위로 갈수록 급격히 줄어드는 분포
      var u = rnd();
      var score = 2 + Math.floor(-Math.log(1 - u * 0.9995) * 6.1);
      if (rnd() < 0.01) score += Math.floor(rnd() * 16);
      if (score < 1) score = 1;

      var name = NAME_A[Math.floor(rnd() * NAME_A.length)] + NAME_B[Math.floor(rnd() * NAME_B.length)];
      if (used[name]) { used[name] += 1; name = name + used[name]; } else { used[name] = 1; }

      GLOBAL.push({ name: name, score: score });
    }
    // 상위 10명은 '고수' 구간으로 채워 현실적인 TOP 10 모양 만들기
    GLOBAL.sort(function (a, b) { return b.score - a.score; });
    var elite = [82, 71, 64, 59, 55, 52, 50, 48, 46, 44, 42, 41, 40, 39, 38, 37, 36, 35, 34, 33, 32, 31, 30, 29, 28, 27, 26];
    for (var k = 0; k < elite.length && k < GLOBAL.length; k++) GLOBAL[k].score = elite[k];
    GLOBAL.sort(function (a, b) { return b.score - a.score; });
  }

  function poolWithMe() {
    var pool = [];
    for (var i = 0; i < GLOBAL.length; i++) {
      pool.push({ name: GLOBAL[i].name, score: GLOBAL[i].score, mine: false });
    }
    if (store.records.length > 0) {
      pool.push({ name: store.nickname || '플레이어', score: store.best, mine: true });
    }
    return pool;
  }

  // 점수 하나의 '전체 등수' 계산: 나보다 높은 점수 인원 + 1
  function rankFor(score) {
    var pool = poolWithMe();
    var better = 0;
    for (var i = 0; i < pool.length; i++) { if (pool[i].score > score) better++; }
    var rank = better + 1;
    if (rank > pool.length) rank = pool.length; // 최하위는 전체 인원으로 고정
    return { rank: rank, total: pool.length, pct: (rank / pool.length) * 100 };
  }

  function sortedPool() {
    var pool = poolWithMe();
    pool.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      if (a.mine !== b.mine) return a.mine ? -1 : 1;
      return 0;
    });
    return pool;
  }

  function tierMsg(pct) {
    if (pct <= 1) return '전설급 기록이에요. 오늘의 1% 안쪽!';
    if (pct <= 5) return '상위 5% 진입 — 손끝이 아주 매끄러웠어요';
    if (pct <= 15) return '상위 15% — 충분히 잘하고 있어요';
    if (pct <= 40) return '상위 40% — 평균보다 위예요';
    if (pct <= 70) return '이제 몸이 풀렸어요. 한 판만 더!';
    return '다음 판엔 더 높이 쌓아봐요';
  }

  var ITEM_CFG = {

  /* =========================================================
     5. 사운드 (Web Audio API)
     ========================================================= */
  var actx = null;

  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { actx = new AC(); } catch (e) { actx = null; return; }
    }
    if (actx.state === 'suspended' && actx.resume) {
      try { actx.resume(); } catch (e) {}
    }
  }

  function tone(opt) {
    if (store.muted || !actx) return;
    var freq = opt.freq || 440;
    var dur = opt.dur || 0.09;
    var type = opt.type || 'sine';
    var gain = typeof opt.gain === 'number' ? opt.gain : 0.055;
    var delay = opt.delay || 0;
    var slideTo = opt.slideTo || 0;
    try {
      var t0 = actx.currentTime + delay;
      var osc = actx.createOscillator();
      var g = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  function sfxTick() { tone({ freq: 300, dur: 0.05, type: 'triangle', gain: 0.03 }); }

  function resize() {

  // 아이템 종류 고르기: 지금 쓸모 있는 것 위주로
  function pickItemKind() {
    var top = G.blocks[G.blocks.length - 1];
    var pool = [];
    if (top && top.w < G.baseW - 4) pool.push('WIDE');   // 폭이 이미 최대면 확장은 의미 없음
    pool.push('SLOW');

    if (!pool.length) pool = ITEM_KINDS.slice(0);
    var k = pool[Math.floor(Math.random() * pool.length)];
    if (k === G.lastItemKind && pool.length > 1) {
      var alt = [];
      for (var i = 0; i < pool.length; i++) if (pool[i] !== k) alt.push(pool[i]);
      if (alt.length) k = alt[Math.floor(Math.random() * alt.length)];

    return k;

  // 기본 이동 속도 (층이 오를수록 조금씩 빨라짐)
  function baseSpeed(level) {

  function speedFactor(level) {
    if (level <= 15) return 0.62;
    var t = clamp((level - 15) / 30, 0, 1);
    return 0.62 + 0.38 * t;
  }

    return baseSpeed(level) * speedFactor(level);
  }

      b.w = target;

      cx = b.x + b.w * 0.5;
      b.flash = 1;
      floatText('황금 확장!', cx, b.y - 24, cfg.color, 23);
      floatText(gain >= 1 ? ('폭 +' + gain + ' · 25% 넓어짐') : '이미 최대 폭!', cx, b.y - 52, '#fff3c4', 13);
    } else if (kind === 'SLOW') {
      floatText('슬로우!', cx, b.y - 24, cfg.color, 23);
      floatText('5층 동안 천천히', cx, b.y - 52, '#e2f4ff', 13);
    } else if (kind === 'SHIELD') {
      G.shield = 1;
      floatText('실드 장착!', cx, b.y - 24, cfg.color, 23);
      floatText('한 번은 살아나요', cx, b.y - 52, '#efe7ff', 13);
    }

    sparkle(cx, b.y + G.blockH * 0.5, 26, cfg.spark);
    sparkle(cx, b.y + G.blockH * 0.5, 10, 'rgba(255,255,255,0.95)');
    sfxItem(kind);
    updateHud();
  }

  // 실드로 완전히 빗나간 실수를 한 번 막아냄
  function useShield(m, top) {
    G.shield = 0;
    var newW = Math.max(14, Math.min(m.w, top.w));
    var cx = top.x + top.w * 0.5;
    var newX = clamp(cx - newW * 0.5, 0, Math.max(0, G.width - newW));
    G.blocks.push({ x: newX, y: m.y, w: newW, level: G.blocks.length, flash: 1, item: null });
    G.level = G.blocks.length - 1;
    G.score = G.level;
    G.moving = null;
    G.combo = 0;
    G.shake = 7;
    floatText('실드 발동!', cx, m.y - 22, '#d6c2ff', 24);
    floatText('살아남았어요', cx, m.y - 50, '#ffffff', 14);
    sparkle(cx, m.y + G.blockH * 0.5, 28, 'rgba(205,175,255,0.95)');
    sparkle(cx, m.y + G.blockH * 0.5, 12, 'rgba(255,255,255,0.95)');
    sfxShield();
    G.spawnTimer = 0.28;
    tickSlow(false);
    updateHud();
  }

  function resolveDrop() {
    var m = G.moving;
    var top = G.blocks[G.blocks.length - 1];
    if (!m || !top) return;

    var off = m.x - top.x;
    var tol = clamp(Math.min(top.w, m.w) * 0.18, 5, 14);
    var left = Math.max(top.x, m.x);
    var right = Math.min(top.x + top.w, m.x + m.w);
    var overlap = right - left;

    // 1) 완전히 빗나감 → 실드가 있으면 한 번 살아남음
    if (overlap <= 0.5) {
      if (G.shield > 0) { useShield(m, top); return; }
      addCut(m.x, m.y, m.w, m.h, m.vx * 0.45, -120, (m.vx > 0 ? 1 : -1) * 2.6, G.level);
      floatText('MISS', G.width * 0.5, m.y - 8, '#ff9a7b', 24);
      G.shake = 10;
      sfxFail();
      G.moving = null;
      endGame('빗나갔어요');
      return;
    }

    var perfect = Math.abs(off) <= tol;
    var newX = perfect ? top.x : left;
    var newW = perfect ? top.w : overlap;
    var placedItem = m.item || null;

    if (perfect) {
      // 정확히 겹침 → 폭 유지, 콤보 증가
      G.combo += 1;
      if (G.combo > G.bestCombo) G.bestCombo = G.combo;
      floatText('PERFECT!', newX + newW * 0.5, m.y - 26, '#7ee0ff', 20);
      sparkle(newX + newW * 0.5, m.y + G.blockH * 0.5, 14, 'rgba(159,243,255,0.95)');
      sfxPerfect(G.combo);

      // 5콤보마다 블록 폭 살짝 회복
      if (G.combo % 5 === 0) {
        var grow = Math.min(8, G.baseW - newW);
        if (grow > 0.5) {
          newW += grow;
          newX = clamp(newX - grow * 0.5, 0, G.width - newW);
          floatText('콤보 보너스 +' + Math.round(grow), newX + newW * 0.5, m.y - 54, '#ffe07a', 13);
          sfxBonus();
          sparkle(newX + newW * 0.5, m.y + G.blockH * 0.5, 10, 'rgba(255,224,122,0.9)');
        }
      }
    } else {
      // 2) 어긋난 부분은 잘려서 떨어짐
      if (off > 0) {
        addCut(right, m.y, (m.x + m.w) - right, m.h, 75, -70, 1.9, G.level);
      } else {
        addCut(m.x, m.y, left - m.x, m.h, -75, -70, -1.9, G.level);
      }
      G.combo = 0;
      G.shake = 4.5;
      dust(newX + newW * 0.5, m.y + G.blockH, 7);
      sfxPlace(G.level);
    }

    var placed = { x: newX, y: m.y, w: newW, level: G.blocks.length, flash: 1, item: placedItem };
    G.blocks.push(placed);
    G.level = G.blocks.length - 1;
    G.score = G.level;
    G.moving = null;

    // 3) 아이템 발동 (성공적으로 쌓았을 때만)
    if (placedItem) applyItem(placedItem, placed);
    tickSlow(placedItem === 'SLOW');

    G.spawnTimer = perfect ? 0.07 : 0.12;
    updateHud();

    // 폭이 너무 좁아지면 더 쌓을 수 없음
    if (placed.w < 10) endGame('블록이 너무 좁아졌어요');
  }

  function endGame(reason) {
    if (G.state !== 'playing') return;
    G.state = 'over';
    G.endReason = reason || '';
    G.finalScore = Math.max(0, G.blocks.length - 1);
    G.score = G.finalScore;
    G.prevBest = store.best;
    G.ending = 0.85;
    saveRun(G.finalScore);
    if (tapHint) tapHint.classList.remove('on');
    updateHud();
    updateAdLock();
  }

  function saveRun(score) {
    store.records.unshift({
      id: 'r' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      score: score,
      at: Date.now()
    });
    if (store.records.length > 40) store.records.length = 40;
    if (score > store.best) store.best = score;
    saveStore();
  }

  function doContinue() {
    if (G.continues >= 1) return;
    G.continues += 1;
    G.state = 'playing';
    G.ending = 0;
    G.combo = 0;
    var top = G.blocks[G.blocks.length - 1];
    if (top) {
      var target = Math.max(top.w, Math.round(G.baseW * 0.45));
      target = Math.min(target, G.width);
      var cx = top.x + top.w * 0.5;
      top.w = target;
      top.x = clamp(cx - target * 0.5, 0, G.width - target);
      top.flash = 1;
    }
    G.moving = null;
    G.spawnTimer = 0.25;
    hideOverlay();
    updateHud();
    updateAdLock();
    sfxBonus();
  }

  /* =========================================================
     8. 프레임 갱신
     ========================================================= */
  function update(dt) {
    G.time += dt;

    if (G.state === 'playing') {
      if (G.spawnTimer > 0) {
        G.spawnTimer -= dt;
        if (G.spawnTimer <= 0 && !G.moving) spawnMoving();
      }
      var m = G.moving;
      if (m) {
        if (!m.dropping) {
          m.x += m.vx * dt;
          if (m.x < 0) { m.x = 0; m.vx = Math.abs(m.vx); }
          if (m.x + m.w > G.width) { m.x = G.width - m.w; m.vx = -Math.abs(m.vx); }
          // 아이템 블록은 반짝이며 존재감을 드러냄
          if (m.item && Math.random() < 0.35) {
            var cfg = ITEM_CFG[m.item];
            G.parts.push({
              x: m.x + Math.random() * m.w,
              y: m.y + G.blockH * 0.5 + (Math.random() - 0.5) * 10,
              vx: (Math.random() - 0.5) * 26,
              vy: -10 - Math.random() * 26,
              life: 0.4 + Math.random() * 0.4,
              max: 0.8,
              color: cfg ? cfg.spark : 'rgba(255,255,255,0.9)',
              r: 1 + Math.random() * 1.8
            });
          }
        } else {
          m.vy += 3200 * dt;
          m.y += m.vy * dt;
          var top = G.blocks[G.blocks.length - 1];
          if (top) {
            var rest = top.y - G.blockH;
            if (m.y >= rest) {
              m.y = rest;
              resolveDrop();
            }
          }
        }
      }
    } else if (G.state === 'ready') {
      // 시작 화면 뒤에서 미리보기 블록이 움직임
      if (G.spawnTimer > 0) {
        G.spawnTimer -= dt;
        if (G.spawnTimer <= 0 && !G.moving) spawnMoving();
      }
      var pm = G.moving;
      if (pm && !pm.dropping) {
        pm.x += pm.vx * dt;
        if (pm.x < 0) { pm.x = 0; pm.vx = Math.abs(pm.vx); }
        if (pm.x + pm.w > G.width) { pm.x = G.width - pm.w; pm.vx = -Math.abs(pm.vx); }
      }
    }

    if (G.state === 'over' && G.ending > 0) {
      G.ending -= dt;
      if (G.ending <= 0) showGameOver();
    }

    // 카메라: 타워가 높아지면 부드럽게 따라 올라감
    var topB = G.blocks[G.blocks.length - 1];
    if (topB) {
      G.camTarget = Math.max(G.height * 0.78, G.height * 0.62 - topB.y);
      G.cam = lerp(G.cam, G.camTarget, 1 - Math.exp(-dt * 5));
    }

    // 잘려 떨어지는 조각
    for (var i = G.cuts.length - 1; i >= 0; i--) {
      var c = G.cuts[i];
      c.vy += 2200 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += c.vr * dt;
      c.a -= dt * 0.55;
      if (c.y + G.cam > G.height + 80 || c.a <= 0) G.cuts.splice(i, 1);
    }

    // 파티클
    for (var j = G.parts.length - 1; j >= 0; j--) {
      var p = G.parts[j];
      p.vy += 900 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) G.parts.splice(j, 1);
    }

    // 떠오르는 글자
    for (var k = G.floats.length - 1; k >= 0; k--) {
      var f = G.floats[k];
      f.y -= dt * 46;
      f.life -= dt;
      if (f.life <= 0) G.floats.splice(k, 1);
    }

    // 블록 플래시 감쇠
    for (var b = 0; b < G.blocks.length; b++) {
      if (G.blocks[b].flash > 0) G.blocks[b].flash = Math.max(0, G.blocks[b].flash - dt * 4);
    }

    G.shake *= Math.exp(-dt * 9);
    if (G.shake < 0.1) G.shake = 0;
  }

  /* =========================================================
     9. 그리기
     ========================================================= */
  var SKIES = [
    { at: 0, top: '#141c3a', mid: '#232a54', bot: '#3c2a5c', glow: '#7f6bff' },
    { at: 12, top: '#1c1032', mid: '#3a1c4e', bot: '#6b2b4a', glow: '#ff8fb1' },
    { at: 24, top: '#241127', mid: '#5a2236', bot: '#9c4a2f', glow: '#ffb56b' },
    { at: 36, top: '#07202c', mid: '#0f3a44', bot: '#14614f', glow: '#5bf0c2' },
    { at: 52, top: '#05142a', mid: '#0d2f56', bot: '#1a5c85', glow: '#7bd7ff' },
    { at: 70, top: '#08081c', mid: '#1b1450', bot: '#3a1d6e', glow: '#c58bff' }
  ];
  var hexCache = {};

  function hex2rgb(h) {
    if (hexCache[h]) return hexCache[h];
    var n = parseInt(h.slice(1), 16);
    var o = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    hexCache[h] = o;
    return o;
  }
  function mixHex(a, b, t) {
    var A = hex2rgb(a), B = hex2rgb(b);
    return 'rgb(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ')';
  }
  function withAlpha(hex, a) {
    var c = hex2rgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function skyAt(level) {
    var i = 0;
    while (i < SKIES.length - 1 && level >= SKIES[i + 1].at) i++;
    var a = SKIES[i];
    var b = SKIES[Math.min(i + 1, SKIES.length - 1)];
    var t = (b.at === a.at) ? 0 : clamp((level - a.at) / (b.at - a.at), 0, 1);
    t = t * t * (3 - 2 * t);
    return {
      top: mixHex(a.top, b.top, t),
      mid: mixHex(a.mid, b.mid, t),
      bot: mixHex(a.bot, b.bot, t),
      glow: mixHex(a.glow, b.glow, t)
    };
  }

  function rrect(x, y, w, h, r) {
    var rr = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  var FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';

  function drawBlock(b, cam, moving) {
    var x = b.x;
    var y = b.y + cam;
    var w = b.w;
    var h = G.blockH;
    if (y > G.height + 80 || y + h < -80) return;

    var cfg = b.item ? ITEM_CFG[b.item] : null;
    var grad = ctx.createLinearGradient(0, y, 0, y + h);
    if (cfg) {
      grad.addColorStop(0, cfg.c1);
      grad.addColorStop(0.55, cfg.c2);
      grad.addColorStop(1, cfg.c3);
    } else {
      var hue = (206 + (b.level || 0) * 6) % 360;
      grad.addColorStop(0, 'hsl(' + hue + ',72%,74%)');
      grad.addColorStop(0.55, 'hsl(' + hue + ',64%,60%)');
      grad.addColorStop(1, 'hsl(' + hue + ',58%,44%)');
    }

    ctx.save();
    ctx.shadowColor = cfg ? cfg.glow : (moving ? 'rgba(120,220,255,0.55)' : 'rgba(0,0,0,0.4)');
    ctx.shadowBlur = cfg ? 20 : (moving ? 22 : 12);
    ctx.shadowOffsetY = moving ? 0 : 6;
    rrect(x, y, w, h, Math.min(7, h / 3.5));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    // 윗면 하이라이트
    if (w > 8) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(x + 3, y + 1.6, Math.max(0, w - 6), 1.6);
    }
    // 외곽선
    ctx.strokeStyle = 'rgba(8,12,26,0.35)';
    ctx.lineWidth = 1;
    rrect(x, y, w, h, Math.min(7, h / 3.5));
    ctx.stroke();

    if (b.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * b.flash).toFixed(3) + ')';
      rrect(x, y, w, h, Math.min(7, h / 3.5));
      ctx.fill();
    }

    // 아이템 블록 전용: 빛나는 테두리 + 아이콘
    if (cfg) {
      var pulse = 0.5 + 0.5 * Math.sin(G.time * (moving ? 7.5 : 3.2) + (b.level || 0) * 0.7);
      ctx.save();
      ctx.globalAlpha = moving ? (0.55 + 0.45 * pulse) : 0.55;
      ctx.strokeStyle = cfg.ring;
      ctx.lineWidth = 2;
      ctx.shadowColor = cfg.glow;
      ctx.shadowBlur = 12 + 12 * pulse;
      rrect(x - 1.5, y - 1.5, w + 3, h + 3, Math.min(9, h / 3));
      ctx.stroke();
      ctx.restore();

      // 블록 안 라벨 (이모지 대신 직접 그려 어떤 기기에서도 똑같이 보이게)
      var fs = Math.max(9, Math.round(Math.min(11, h * 0.42)));
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 ' + fs + 'px ' + FONT;
      var tw = ctx.measureText(cfg.label).width;
      if (w >= tw + 12) {
        rrect(x + w * 0.5 - (tw + 12) * 0.5, y + h * 0.5 - 7, tw + 12, 14, 7);
        ctx.fillStyle = 'rgba(12,10,26,0.34)';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillText(cfg.label, x + w * 0.5, y + h * 0.5 + 0.5);
      }
      ctx.restore();
    }
  }

  function render() {
    var W = G.width;
    var H = G.height;
    ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var sky = skyAt(G.level);

    // 배경 그라데이션
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, sky.top);
    bg.addColorStop(0.55, sky.mid);
    bg.addColorStop(1, sky.bot);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 은은한 빛무리
    var rad = ctx.createRadialGradient(W * 0.5, H * 0.44, 8, W * 0.5, H * 0.44, Math.max(W, H) * 0.8);
    rad.addColorStop(0, withAlpha(hexOf(sky.glow), 0.20));
    rad.addColorStop(1, withAlpha(hexOf(sky.glow), 0));
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, W, H);

    // 별
    for (var s = 0; s < STARS.length; s++) {
      var st = STARS[s];
      var sy = ((st.y * H) + G.cam * 0.05 * st.sp) % H;
      if (sy < 0) sy += H;
      var tw = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(G.time * 1.7 + st.tw));
      ctx.beginPath();
      ctx.arc(st.x * W, sy, st.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(226,236,255,' + tw.toFixed(3) + ')';
      ctx.fill();
    }

    ctx.save();
    var shx = (Math.random() - 0.5) * G.shake;
    var shy = (Math.random() - 0.5) * G.shake;
    ctx.translate(shx, shy);

    var cam = G.cam;

    // 바닥 받침
    var base = G.blocks[0];
    if (base) {
      var bx = base.x, by = base.y + cam;
      if (by < H + 100) {
        var ped = ctx.createLinearGradient(0, by + G.blockH, 0, by + G.blockH + 90);
        ped.addColorStop(0, withAlpha(hexOf(sky.glow), 0.16));
        ped.addColorStop(1, withAlpha(hexOf(sky.glow), 0));
        ctx.fillStyle = ped;
        ctx.fillRect(bx - 26, by + G.blockH, base.w + 52, 90);
      }
    }

    // 쌓인 블록
    for (var i = 0; i < G.blocks.length; i++) drawBlock(G.blocks[i], cam, false);

    // 조준 가이드 (움직이는 블록 아래로 점선)
    var m = G.moving;
    var top = G.blocks[G.blocks.length - 1];
    if (m && top && !m.dropping) {
      var cx = m.x + m.w * 0.5;
      var y1 = m.y + cam + G.blockH;
      var y2 = top.y + cam;
      if (y2 > y1 + 4) {
        ctx.save();
        ctx.setLineDash([3, 6]);
        ctx.strokeStyle = m.item ? 'rgba(255,238,170,0.42)' : 'rgba(200,235,255,0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, y1);
        ctx.lineTo(cx, y2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 움직이는 블록
    if (m) drawBlock({ x: m.x, y: m.y, w: m.w, level: m.level, flash: 0, item: m.item }, cam, true);

    // 잘려 떨어진 조각
    for (var c = 0; c < G.cuts.length; c++) {
      var p = G.cuts[c];
      var py = p.y + cam;
      if (py > H + 60) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.a);
      ctx.translate(p.x + p.w * 0.5, py + p.h * 0.5);
      ctx.rotate(p.rot);
      var hue = (206 + (p.level || 0) * 6) % 360;
      var g2 = ctx.createLinearGradient(0, -p.h * 0.5, 0, p.h * 0.5);
      g2.addColorStop(0, 'hsl(' + hue + ',70%,72%)');
      g2.addColorStop(1, 'hsl(' + hue + ',55%,38%)');
      ctx.fillStyle = g2;
      rrect(-p.w * 0.5, -p.h * 0.5, p.w, p.h, 3);
      ctx.fill();
      ctx.restore();
    }

    // 파티클
    for (var q = 0; q < G.parts.length; q++) {
      var pt = G.parts[q];
      var al = Math.max(0, pt.life / pt.max);
      ctx.globalAlpha = al;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y + cam, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 떠오르는 글자
    for (var f = 0; f < G.floats.length; f++) {
      var ft = G.floats[f];
      var fa = Math.max(0, ft.life / ft.max);
      ctx.save();
      ctx.globalAlpha = fa;
      ctx.font = '800 ' + ft.size + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, clamp(ft.x, 50, G.width - 50), ft.y + cam);
      ctx.restore();
    }

    ctx.restore();

    // 아래쪽 비네트
    var vg = ctx.createLinearGradient(0, H * 0.72, 0, H);
    vg.addColorStop(0, 'rgba(4,7,16,0)');
    vg.addColorStop(1, 'rgba(4,7,16,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
  }

  // mixHex가 만든 'rgb(...)' 문자열에서 hex를 복원하기 위한 작은 도우미
  function hexOf(rgbStr) {
    var m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(rgbStr);
    if (!m) return '#7f6bff';
    var r = parseInt(m[1], 10), g = parseInt(m[2], 10), b = parseInt(m[3], 10);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  var adTimers = {};

  function adListFor(kind) {
    var conf = AD_CONFIG.self || {};
    var banners = conf.banners || {};
    var list = banners[kind];
    if (!list) return [];
    return (Object.prototype.toString.call(list) === '[object Array]') ? list : [list];

  // 스크립트 태그는 innerHTML로 넣으면 실행되지 않으므로 직접 다시 만들어 실행
  function injectHtml(container, html) {
    container.innerHTML = html;
    var scripts = container.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      if (old.src) s.src = old.src;
      else s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
  }

  function buildSelfAd(banner, kind) {
    var a = document.createElement('a');
    a.className = 'ad-link' + (kind === 'result' ? ' ad-link-result' : '');
    a.href = banner.url || 'https://smartstore.naver.com/japanmartbox';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', (banner.title || '광고') + ' — 새 창에서 열기');

    if (banner.flag) {
      var fg = el('span', 'ad-flag flag-' + String(banner.flag));
      fg.setAttribute('aria-hidden', 'true');
      a.appendChild(fg);
    } else {
      a.appendChild(el('span', 'ad-emoji', banner.emoji || '🛒'));
    }

    if (kind === 'result') {
      a.appendChild(el('span', 'ad-brand', banner.title || ''));
      a.appendChild(el('span', 'ad-desc', (banner.desc || '')));
      a.appendChild(el('span', 'ad-cta-big', (banner.cta || '바로가기') + ' →'));
    } else {
      var col = el('span', 'ad-col');
      col.appendChild(el('span', 'ad-brand', banner.title || ''));
      col.appendChild(el('span', 'ad-desc', (banner.desc || '')));
      a.appendChild(col);
      a.appendChild(el('span', 'ad-cta', (banner.cta || '구경하기') + ' →'));
    }
    a.appendChild(el('span', 'ad-mini', 'AD'));
    return a;
  }

  function fillAdSlot(slot, kind) {
    if (!slot) return;
    if (adTimers[kind]) { window.clearInterval(adTimers[kind]); adTimers[kind] = null; }
    slot.innerHTML = '';
    slot.classList.remove('ad-empty');

    var mode = AD_CONFIG.mode;

    if (mode === 'none') {
      slot.innerHTML = '';
      slot.style.display = 'none';
      return;
    }
    slot.style.display = '';

    if (mode === 'custom_html') {
      var html = (AD_CONFIG.custom_html && AD_CONFIG.custom_html[kind]) || '';
      if (!String(html).replace(/\s/g, '')) {
        slot.classList.add('ad-empty');
        slot.textContent = 'AD';
        return;
      }
      injectHtml(slot, html);
      return;
    }

    var list = adListFor(kind);
    if (!list.length) {
      slot.classList.add('ad-empty');
      slot.textContent = 'AD';
      return;
    }

    var idx = 0;
    var show = function (first) {
      if (!first && !slot.isConnected) {
        if (adTimers[kind]) { window.clearInterval(adTimers[kind]); adTimers[kind] = null; }
        return;
      }
      slot.innerHTML = '';
      slot.appendChild(buildSelfAd(list[idx % list.length], kind));
      idx += 1;
    };
    show(true);
    if (list.length > 1) {
      var ms = Math.max(3000, Number(AD_CONFIG.self && AD_CONFIG.self.rotateMs) || 12000);
      adTimers[kind] = window.setInterval(show, ms);
    }
  }

  function updateAdLock() {

  function lbRow(rank, entry) {
    var row = el('div', 'lb-row' + (entry.mine ? ' mine' : ''));

  function fillLeaderboard(container) {
    container.innerHTML = '';
    var pool = sortedPool();
    var myIndex = -1;
    for (var i = 0; i < pool.length; i++) {
      if (pool[i].mine) { myIndex = i; break; }
    }

    container.appendChild(el('div', 'lb-title', '오늘의 TOP 10'));
    var top = el('div', 'lb-list');
    var topN = Math.min(10, pool.length);
    for (var k = 0; k < topN; k++) top.appendChild(lbRow(k + 1, pool[k]));
    container.appendChild(top);

    if (myIndex >= 0) {
      container.appendChild(el('div', 'lb-title', '내 순위 근처'));
      var near = el('div', 'lb-list');
      var start = Math.max(0, myIndex - 2);
      var end = Math.min(pool.length - 1, myIndex + 2);
      if (start > 0) near.appendChild(el('div', 'lb-gap', '· · ·'));
      for (var j = start; j <= end; j++) near.appendChild(lbRow(j + 1, pool[j]));
      if (end < pool.length - 1) near.appendChild(el('div', 'lb-gap', '· · ·'));
      container.appendChild(near);
    }
  }

      : '닉네임을 등록하면 순위표에 내 기록이 표시됩니다');

      store.nickname = v || '플레이어';
      saveStore();

      fillLeaderboard(lbWrap);

        e.stopPropagation();
        e.preventDefault();
        applyNick();
        input.blur();
      }
    });

    // 다시 도전 / 처음으로

      e.stopPropagation();
      newGame();
    });

      showStart();

    btnRow.appendChild(home);

    var reward = el('div', 'reward');

      reward.appendChild(el('div', 'reward-done', '이번 판 이어하기 사용 완료'));

      var panel = el('div', 'reward-panel');
      panel.appendChild(el('span', 'reward-emoji', '🛡'));

      txt.appendChild(el('b', '', '이어하기 1회'));
      txt.appendChild(el('span', '', '블록 폭을 조금 회복해 한 번 더 쌓아요'));
      panel.appendChild(txt);
      reward.appendChild(panel);

      // 외부 보상형 광고 코드가 준비되면 여기에 그대로 들어갑니다
      if (AD_CONFIG.mode === 'custom_html' && AD_CONFIG.custom_html.reward) {
        var rslot = el('div', 'ad-result');
        reward.appendChild(rslot);
        injectHtml(rslot, AD_CONFIG.custom_html.reward);

      var rewardBtn = el('button', 'btn ghost', '이어하기 (1회)');
      rewardBtn.type = 'button';
      var status = el('div', 'reward-status', '잠시 기다리면 이어서 쌓을 수 있어요');
      reward.appendChild(rewardBtn);
      reward.appendChild(status);

      var phase = 'idle';
      rewardBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (phase === 'ready') { doContinue(); return; }
        if (phase !== 'idle') return;
        phase = 'wait';
        var left = 3;
        rewardBtn.disabled = true;
        var step = function () {
          if (left <= 0) {
            if (rewardTimer) { window.clearInterval(rewardTimer); rewardTimer = null; }
            rewardBtn.disabled = false;
            rewardBtn.textContent = '이어하기';
            status.textContent = '블록 폭을 회복하고 이어갑니다';
            phase = 'ready';
            return;
          }
          rewardBtn.textContent = '준비 중… ' + left;
          left -= 1;
        };
        step();
        rewardTimer = window.setInterval(step, 1000);
      });
    }
    card.appendChild(reward);

    fillLeaderboard(lbWrap);
    card.appendChild(lbWrap);

    card.appendChild(el('p', 'disclaimer', '오늘의 랭킹 · 내 기록은 이 기기에 저장됩니다'));

    overlay.appendChild(card);
    overlay.classList.add('show');
    overlay.classList.remove('start-mode');
    overlay.scrollTop = 0;
    updateAdLock();
  }

  /* =========================================================
     14. 입력
     ========================================================= */
  function isInside(node, sel) {
    var n = node;
    while (n && n !== document) {
      if (n.classList && n.classList.contains(sel)) return true;
      n = n.parentNode;
    }
    return false;
  }

  stage.addEventListener('pointerdown', function (e) {
    var t = e.target;
    if (t && t.tagName === 'INPUT') return;
    if (isInside(t, 'overlay') || isInside(t, 'icon-btn') || isInside(t, 'ad-link')) return;
    if (G.state === 'playing') {
      if (e.preventDefault) e.preventDefault();
      tapDrop();
    }
  }, { passive: false });

  // 마우스/터치 모두 지원하지 않는 환경 보조
  stage.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.tagName === 'INPUT') return;
    if (isInside(t, 'overlay') || isInside(t, 'icon-btn') || isInside(t, 'ad-link')) return;
    if (G.state === 'playing' && G.moving && !G.moving.dropping) tapDrop();
  });

  window.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.repeat) return;
    var isSpace = (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar');
    var isEnter = (e.code === 'Enter' || e.key === 'Enter');
    if (!isSpace && !isEnter) return;
    if (G.state === 'playing') {
      e.preventDefault();
      tapDrop();
    } else if (G.state === 'ready') {
      e.preventDefault();
      newGame();
    }
  });

  document.addEventListener('visibilitychange', function () {
    G.lastT = 0;
  });

  window.addEventListener('resize', function () {
    resize();
  });
  if (window.ResizeObserver) {
    try { new window.ResizeObserver(function () { resize(); }).observe(stage); } catch (e) {}
  }

  /* =========================================================
     15. 메인 루프
     ========================================================= */
  function loop(ts) {
    if (!G.lastT) G.lastT = ts;
    var dt = (ts - G.lastT) / 1000;
    G.lastT = ts;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    window.requestAnimationFrame(loop);
  }

  /* =========================================================
     16. 시작
     ========================================================= */
  loadStore();
  buildGlobal();
  buildStars();
  mountAds();
  resize();
  setupScene();
  setMuted(store.muted);
  updateHud();
  showStart();
  window.requestAnimationFrame(loop);

  // 검증용 훅 (게임 동작에는 영향 없음)
  window.__TowerV2 = {
    start: newGame,
    tap: tapDrop,
    step: function (ms) { update(ms / 1000); render(); },
    info: function () {
      var top = G.blocks.length ? G.blocks[G.blocks.length - 1] : null;
      return {
        state: G.state,
        level: G.level,
        blocks: G.blocks.length,
        score: G.finalScore,
        combo: G.combo,
        moving: !!G.moving,
        movingItem: G.moving ? (G.moving.item || null) : null,
        movingSpeed: G.moving ? Math.abs(G.moving.vx) : 0,
        width: G.width,
        baseW: G.baseW,
        topW: top ? top.w : 0,
        topX: top ? top.x : 0,
        itemAt: G.itemAt,
        slowLeft: G.slowLeft,
        shield: G.shield,
        itemsUsed: G.itemUsed
      };
    },
    ready: function () { G.state = 'ready'; setupScene(); hideOverlay(); showStart(); },
    forceNextItem: function (kind) {
      var k = kind || 'WIDE';
      if (G.moving && !G.moving.dropping) { G.moving.item = k; G.forceItem = null; }
      else { G.forceItem = k; }
    },
    setMovingX: function (x) { if (G.moving) G.moving.x = x; },
    rank: rankFor,
    speedFor: speedFor,
    speedFactor: speedFactor,
    baseSpeed: baseSpeed,
